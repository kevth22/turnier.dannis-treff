<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dart11en Kalender</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="app-header">
  <img src="dart11enlogo.png" class="logo" alt="Dart11en Logo">
  <h1>Mitglieder-Kalender</h1>
  <p>Spieltage, Termine & Eintragungen</p>
</header>

<main class="app-container">

  <section id="kalenderBereich" style="display:none;">

    <div class="info-card">
      <h2>📅 Vereinskalender</h2>
      <p>Hier siehst du alle Spieltage und Termine.</p>
    </div>

    <div id="adminSpieltagBox" class="info-card" style="display:none;">
      <h2>➕ Spieltag eintragen</h2>

      <input id="spieltagLiga" type="text" placeholder="Liga z.B. C2 Rhein Ruhr">
      <input id="spieltagDatum" type="date">
      <input id="spieltagTreffen" type="time">
      <input id="spieltagAnwurf" type="time">
      <input id="spieltagOrt" type="text" placeholder="Ort / Gegner">

      <select id="spieltagTyp">
        <option value="heim">Heimspiel</option>
        <option value="auswaerts">Auswärtsspiel</option>
      </select>

      <button class="main-button" onclick="spieltagSpeichern()">Spieltag speichern</button>
    </div>

    <div class="info-card">
      <h2 id="monatTitel">Kalender</h2>

      <div class="kalender-nav">
        <button onclick="monatZurueck()">◀</button>
        <button onclick="monatVor()">▶</button>
      </div>

      <div class="kalender-grid kalender-kopf">
        <div>Mo</div>
        <div>Di</div>
        <div>Mi</div>
        <div>Do</div>
        <div>Fr</div>
        <div>Sa</div>
        <div>So</div>
      </div>

      <div id="kalenderGrid" class="kalender-grid"></div>

      <h3>Spieltage in diesem Monat</h3>
      <div id="spieltagListe"></div>
    </div>

    <div id="spieltagDetails" class="info-card" style="display:none;"></div>

  </section>

</main>

<nav class="bottom-nav">
  <a href="index.html">🏠<br>Home</a>
  <a href="turniere.html">🎯<br>Turniere</a>
  <a href="liga.html">🏆<br>Liga</a>
  <a href="kader.html">👥<br>Kader</a>
</nav>

<script type="module" src="kalender.js"></script>

</body>
</html>
